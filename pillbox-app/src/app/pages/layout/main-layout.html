<div class="app-shell">
  <button
    class="menu-button"
    [class.sidebar-open]="sidebarAbierto"
    type="button"
    (click)="toggleSidebar()"
    [attr.aria-expanded]="sidebarAbierto"
    aria-controls="main-navigation"
    [attr.aria-label]="sidebarAbierto ? 'Cerrar menú' : 'Abrir menú'">
    <span class="material-icons" aria-hidden="true">menu</span>
  </button>

  <aside id="main-navigation" class="sidebar" [class.abierto]="sidebarAbierto">
    <div>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span class="material-icons">medication</span></div>
        <div class="brand-text">
          <strong>Pillbox</strong>
          <span>Control de medicación</span>
        </div>
      </div>

      <nav class="nav-menu" aria-label="Menú principal">
        <p class="nav-title">NAVEGACIÓN</p>
        <button class="nav-item" routerLink="/dashboard" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }">
          <span class="material-icons" aria-hidden="true">dashboard</span>
          <span>Dashboard</span>
        </button>

        <button class="nav-item" routerLink="/medicamentos" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }">
          <span class="material-icons" aria-hidden="true">medication</span>
          <span>Medicamentos</span>
        </button>

        <button class="nav-item" routerLink="/horarios" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }">
          <span class="material-icons" aria-hidden="true">schedule</span>
          <span>Horarios</span>
        </button>

        <button class="nav-item" routerLink="/registros" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }">
          <span class="material-icons" aria-hidden="true">history</span>
          <span>Registros</span>
        </button>

        <button class="nav-item" routerLink="/cuentas-vinculadas" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }">
          <span class="material-icons" aria-hidden="true">supervisor_account</span>
          <span>Cuentas vinculadas</span>
        </button>

        <button class="nav-item" routerLink="/dispositivo" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }">
          <span class="material-icons" aria-hidden="true">devices</span>
          <span>Dispositivo</span>
        </button>
      </nav>
    </div>

    <div class="sidebar-footer">
      <button class="nav-item logout" (click)="cerrarSesion()">
        <span class="material-icons" aria-hidden="true">logout</span>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </aside>

  <div class="main-panel" [class.with-sidebar]="sidebarAbierto">
    <header class="topbar">
      <div class="topbar-start">
        <div class="breadcrumb" aria-label="Ubicación actual">
          <strong>{{ breadcrumbActual }}</strong>
        </div>
      </div>

      <button type="button" class="topbar-user" [matMenuTriggerFor]="cuentaMenu" aria-label="Cambiar de cuenta">
        <div class="user-avatar">{{ (cuentaActiva?.nombre || usuario?.nombre)?.charAt(0)?.toUpperCase() || 'U' }}</div>
        <div>
          <small>{{ cuentaActiva ? 'Viendo como' : 'Usuario' }}</small>
          <strong>{{ cuentaActiva?.nombre || usuario?.nombre || 'Sin nombre' }}</strong>
        </div>
        <span class="material-icons topbar-user-caret" aria-hidden="true">expand_more</span>
      </button>

      <mat-menu #cuentaMenu="matMenu" xPosition="before">
        <button mat-menu-item type="button" [class.cuenta-activa-item]="!cuentaActiva" (click)="volverAMiCuenta()">
          <span class="material-icons" aria-hidden="true">person</span>
          Mi cuenta ({{ usuario?.nombre }})
        </button>
        <button
          mat-menu-item
          type="button"
          *ngFor="let v of cuentasMonitoreadas"
          [class.cuenta-activa-item]="cuentaActiva?.id === v.titular.id"
          (click)="verComo(v.titular)"
        >
          <span class="material-icons" aria-hidden="true">visibility</span>
          {{ v.titular.nombre }}
        </button>
        <button mat-menu-item type="button" routerLink="/cuentas-vinculadas">
          <span class="material-icons" aria-hidden="true">supervisor_account</span>
          Cuentas vinculadas
        </button>
      </mat-menu>
    </header>

    <main class="content-area">
      <router-outlet></router-outlet>
    </main>

    <footer class="app-footer">
      <span>Electronic Pillbox</span><span class="footer-separator">•</span><span>Tu tratamiento, siempre organizado</span>
    </footer>
  </div>

  <button *ngIf="sidebarAbierto" class="sidebar-backdrop" type="button" (click)="toggleSidebar()" aria-label="Cerrar menú"></button>
</div>

<app-medication-reminder-modal></app-medication-reminder-modal>
