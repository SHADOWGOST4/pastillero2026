<body>
  <div class="background">
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <div class="login-container">
    <div class="login-box">
      <div class="logo-section">
        <img src="logo_fet.png" alt="Logo fet" class="logo-img-form">
        <h1>Iniciar Sesión</h1>
      </div>

      <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

      <div class="form-group">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo Electrónico / Usuario</mat-label>
          <input matInput id="email" [(ngModel)]="usuario.correo" placeholder="ejemplo@mabsbygabs.com" type="email">
        </mat-form-field>
      </div>

      <div class="form-group">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput id="password" [(ngModel)]="usuario.password" placeholder="••••••••" type="password">
        </mat-form-field>
      </div>

      <button class="btn-login" (click)="login()">Ingresar</button>

      <div class="register">
        <p>¿Aún no tienes cuenta? <a href="/registro">Regístrate aquí</a></p>
      </div>
    </div>
  </div>
</body>
